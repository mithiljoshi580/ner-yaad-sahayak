name: yaad_sahayak
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish the package to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder may be overridden in flutter build by specifying
# --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# Read more about Android versioning at:
# https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  shared_preferences: ^2.5.5
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1

  # Voice recording and audio
  record: ^7.1.1
  path_provider: ^2.1.6
  firebase_storage: ^13.0.2
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints.
  # The lint set provided by the package is activated in the
  # `analysis_options.yaml` file located at the root of your package.
  flutter_lints: ^6.0.0

# For information on the general Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # To add assets to your application, add an assets section here:
  # assets:
  #   - images/a_dot_burr.jpeg

  # An asset can refer to one or more resolution-specific variants.
  # For details, see:
  # https://flutter.dev/to/resolution-aware-asset-variants

  # To add custom fonts to your application, add a fonts section here.
  # Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700